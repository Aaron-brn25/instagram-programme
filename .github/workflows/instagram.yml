name: Instagram
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Publier les Reels arrivés à l'heure
        run: python3 publier_ig.py
        env:
          META_JETONS: ${{ secrets.META_JETONS }}
          GH_TOKEN: ${{ github.token }}
      - name: Enregistrer la file
        if: always()
        run: |
          git config user.name "publieur"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "file : mise à jour"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
